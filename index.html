<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Los Ortegas">
<meta name="theme-color" content="#000000">
<title>Los Ortegas — Bass Settings</title>
<style>
:root{--red:#a93226;--purple-hdr:#2d1c4a;--purple-body:#1a0f2e;--purple-txt:#c4a8f0;--purple-ring:#7b5ab5;--black-hdr:#111;--black-body:#080808;--black-txt:#cccccc;--black-ring:#555;--gold-hdr:#3d2800;--gold-body:#251800;--gold-txt:#e8b84b;--gold-ring:#9a6800;--blue-hdr:#1a2e4a;--blue-body:#0f1e33;--blue-txt:#7ab8f0;--blue-ring:#2a7acc;--gray-hdr:#2a2a2a;--gray-body:#1a1a1a;--gray-txt:#cccccc;--gray-ring:#666;--yell-hdr:#2e2a00;--yell-body:#1c1900;--yell-txt:#d4c44a;--yell-ring:#8a7a00;--grn-hdr:#1a2e1a;--grn-body:#0f1f0f;--grn-txt:#7acf7a;--grn-ring:#2d8a2d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#0a0a0a;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding-bottom:24px}
.header{background:#000;padding:12px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #1a1a1a;position:sticky;top:0;z-index:10}
.header img{width:80px;height:80px;object-fit:contain;display:block}
.header-sub{font-size:10px;color:#555;letter-spacing:3px;margin-top:4px;text-transform:uppercase}
.body-pad{padding:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:9px;text-align:center;border-radius:8px;border:0.5px solid #333;font-size:12px;font-weight:600;cursor:pointer;background:#111;color:#777;letter-spacing:1px;transition:all .15s}
.tab.active{background:var(--red);border-color:var(--red);color:#fff}
.song-list{display:flex;flex-direction:column;gap:6px}
.song-btn{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;border:0.5px solid #222;background:#111;cursor:pointer;text-align:left;-webkit-user-select:none}
.song-btn:active{background:#1a1a1a}
.song-num{font-size:11px;color:#444;min-width:20px}
.song-info{flex:1;min-width:0}
.song-name{font-size:14px;font-weight:500;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-author{font-size:10px;color:#555;margin-top:2px}
.song-badges{display:flex;gap:4px;flex-shrink:0}
.bt{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:600;white-space:nowrap}
.drop-e{background:#7a1a1a;color:#ffaaaa}
.drop-d{background:#1a3a7a;color:#aaccff}
.drop-c{background:#1a5a1a;color:#aaffaa}
.squier{background:#3a1a6a;color:#ccaaff}
.yamaha{background:#111;color:#aaa;border:0.5px solid #444}
.config-panel{display:none}
.config-panel.open{display:block}
.cfg-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.cfg-title{font-size:15px;font-weight:600;color:#e0e0e0}
.cfg-author{font-size:11px;color:#555;margin-bottom:12px}
.back-btn{font-size:12px;color:#777;cursor:pointer;padding:6px 12px;border:0.5px solid #333;border-radius:8px;background:#111}
.back-btn:active{background:#1a1a1a}
.eq-block{border-radius:12px;border:0.5px solid #222;margin-bottom:10px;overflow:hidden}
.eq-hdr{padding:8px 14px;display:flex;align-items:center;justify-content:space-between}
.eq-title{font-size:11px;font-weight:600;letter-spacing:1px}
.eq-body{padding:12px 14px}
.pill{font-size:9px;padding:3px 8px;border-radius:10px;font-weight:600}
.p-on{background:#1a4a1a;color:#6acf6a}
.p-byp{background:#2a2a2a;color:#666}
.bs .eq-hdr{background:var(--purple-hdr)}.bs .eq-title{color:var(--purple-txt)}.bs .eq-body{background:var(--purple-body)}.bs .kv{color:var(--purple-txt)}
.by .eq-hdr{background:var(--black-hdr)}.by .eq-title{color:var(--black-txt)}.by .eq-body{background:var(--black-body)}.by .kv{color:var(--black-txt)}
.ba .eq-hdr{background:var(--gold-hdr)}.ba .eq-title{color:var(--gold-txt)}.ba .eq-body{background:var(--gold-body)}.ba .kv{color:var(--gold-txt)}
.bc .eq-hdr{background:var(--blue-hdr)}.bc .eq-title{color:var(--blue-txt)}.bc .eq-body{background:var(--blue-body)}.bc .kv{color:var(--blue-txt)}
.bm .eq-hdr{background:var(--gray-hdr)}.bm .eq-title{color:var(--gray-txt)}.bm .eq-body{background:var(--gray-body)}.bm .kv{color:var(--gray-txt)}
.bh .eq-hdr{background:var(--yell-hdr)}.bh .eq-title{color:var(--yell-txt)}.bh .eq-body{background:var(--yell-body)}.bh .kv{color:var(--yell-txt)}
.bj .eq-hdr{background:var(--grn-hdr)}.bj .eq-title{color:var(--grn-txt)}.bj .eq-body{background:var(--grn-body)}.bj .kv{color:var(--grn-txt)}
.knobs{display:flex;gap:8px;flex-wrap:wrap}
.ki{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:48px}
.kl{font-size:9px;color:#444;letter-spacing:.5px}
.kv{font-size:12px;font-weight:600}
.db-row{display:flex;gap:8px;margin-bottom:10px}
.db{flex:1;padding:5px 0;text-align:center;border-radius:8px;font-size:10px;font-weight:600;border:.5px solid}
.db-on{background:#1a4a1a;color:#6acf6a;border-color:#2d6e2d}
.db-off{background:#141414;color:#444;border-color:#2a2a2a}
.lev{font-size:9px;padding:3px 8px;border-radius:10px;background:#1a1a1a;color:#999;font-weight:600;border:.5px solid #333}
</style>

let csl=1;
const RINGS={squier:'#7b5ab5',yamaha:'#555',amp:'#9a6800',cs3:'#2a7acc',mxr:'#666',hartke:'#8a7a00',joyo:'#2d8a2d'};
const TXTS={squier:'#c4a8f0',yamaha:'#cccccc',amp:'#e8b84b',cs3:'#7ab8f0',mxr:'#cccccc',hartke:'#d4c44a',joyo:'#7acf7a'};

function ksvg(v,a,rc){
  const vv=a?v:0,p=vv/10,sa=-225*Math.PI/180,ea=sa+p*270*Math.PI/180,cx=18,cy=18,r=13;
  const x1=cx+r*Math.cos(sa),y1=cy+r*Math.sin(sa),x2=cx+r*Math.cos(ea),y2=cy+r*Math.sin(ea);
  const lg=p>0.999?1:0,bx=cx+r*Math.cos(45*Math.PI/180),by=cy+r*Math.sin(45*Math.PI/180);
  return`<svg width="44" height="44" viewBox="0 0 36 36"><path d="M ${x1} ${y1} A ${r} ${r} 0 1 1 ${bx} ${by}" fill="none" stroke="#252525" stroke-width="3.5" stroke-linecap="round"/>${p>0?`<path d="M ${x1} ${y1} A ${r} ${r} 0 ${lg} 1 ${x2} ${y2}" fill="none" stroke="${rc}" stroke-width="3.5" stroke-linecap="round"/>`:''}><circle cx="18" cy="18" r="7.5" fill="#141414"/><line x1="18" y1="18" x2="${18+6*Math.cos(ea)}" y2="${18+6*Math.sin(ea)}" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>`;
}
function rk(l,v,a,rc,tc){return`<div class="ki"><div class="kl">${l}</div>${ksvg(v,a,rc)}<div class="kv" style="color:${tc}">${a?v:0}</div></div>`}

function rcfg(s){
  const sq=s.bass==="Squier JB";
  let h=sq
    ?`<div class="eq-block bs"><div class="eq-hdr"><span class="eq-title">SQUIER JB</span></div><div class="eq-body"><div class="knobs">${rk('MÁST',s.squier.mast,true,RINGS.squier,TXTS.squier)}${rk('PUEN',s.squier.puen,true,RINGS.squier,TXTS.squier)}${rk('TONO',s.squier.tono,true,RINGS.squier,TXTS.squier)}</div></div></div>`
    :`<div class="eq-block by"><div class="eq-hdr"><span class="eq-title">YAMAHA BB-1024X</span><span class="lev">${s.yamaha.lev}</span></div><div class="eq-body"><div class="knobs">${rk('VOL',s.yamaha.vol,true,RINGS.yamaha,TXTS.yamaha)}${rk('TONO',s.yamaha.tono,true,RINGS.yamaha,TXTS.yamaha)}</div></div></div>`;
  const a=s.amp;
  h+=`<div class="eq-block ba"><div class="eq-hdr"><span class="eq-title">FENDER BASSMAN TV</span></div><div class="eq-body"><div class="db-row"><div class="db ${a.deep?'db-on':'db-off'}">DEEP ${a.deep?'●':'○'}</div><div class="db ${a.bright?'db-on':'db-off'}">BRIGHT ${a.bright?'●':'○'}</div></div><div class="knobs">${rk('GAIN',a.gain,true,RINGS.amp,TXTS.amp)}${rk('BASS',a.bass,true,RINGS.amp,TXTS.amp)}${rk('MID',a.mid,true,RINGS.amp,TXTS.amp)}${rk('TREB',a.treb,true,RINGS.amp,TXTS.amp)}</div></div></div>`;
  const c=s.cs3;
  h+=`<div class="eq-block bc"><div class="eq-hdr"><span class="eq-title">BOSS CS-3</span><span class="pill ${c.on?'p-on':'p-byp'}">${c.on?'ON':'BYP'}</span></div><div class="eq-body"><div class="knobs">${rk('LVL',c.lvl,c.on,RINGS.cs3,TXTS.cs3)}${rk('TONE',c.tone,c.on,RINGS.cs3,TXTS.cs3)}${rk('ATK',c.atk,c.on,RINGS.cs3,TXTS.cs3)}${rk('SUS',c.sus,c.on,RINGS.cs3,TXTS.cs3)}</div></div></div>`;
  const m=s.mxr;
  h+=`<div class="eq-block bm"><div class="eq-hdr"><span class="eq-title">MXR M89</span><span class="pill ${m.on?'p-on':'p-byp'}">${m.on?'ON':'BYP'}</span></div><div class="eq-body"><div class="knobs">${rk('CLN',m.cln,m.on,RINGS.mxr,TXTS.mxr)}${rk('VOL',m.vol,m.on,RINGS.mxr,TXTS.mxr)}${rk('TONE',m.tone,m.on,RINGS.mxr,TXTS.mxr)}${rk('DRV',m.drv,m.on,RINGS.mxr,TXTS.mxr)}</div></div></div>`;
  const hk=s.hartke;
  h+=`<div class="eq-block bh"><div class="eq-hdr"><span class="eq-title">HARTKE HF44</span><span class="pill ${hk.on?'p-on':'p-byp'}">${hk.on?'ON':'BYP'}</span></div><div class="eq-body"><div class="knobs">${rk('LVL',hk.lvl,hk.on,RINGS.hartke,TXTS.hartke)}${rk('GAIN',hk.gain,hk.on,RINGS.hartke,TXTS.hartke)}${rk('MID',hk.mid,hk.on,RINGS.hartke,TXTS.hartke)}${rk('TONE',hk.tone,hk.on,RINGS.hartke,TXTS.hartke)}</div></div></div>`;
  const j=s.joyo;
  h+=`<div class="eq-block bj"><div class="eq-hdr"><span class="eq-title">JOYO DELAY</span><span class="pill ${j.on?'p-on':'p-byp'}">${j.on?'ON':'BYP'}</span></div><div class="eq-body"><div class="knobs">${rk('TIME',j.time,j.on,RINGS.joyo,TXTS.joyo)}${rk('MIX',j.mix,j.on,RINGS.joyo,TXTS.joyo)}${rk('REP',j.rep,j.on,RINGS.joyo,TXTS.joyo)}</div></div></div>`;
  return h;
}

function tc(t){return t==='Drop E'?'drop-e':t==='Drop D'?'drop-d':'drop-c'}
function bc(b){return b==='Squier JB'?'squier':'yamaha'}
function bl(b){return b==='Squier JB'?'SJB':'YBB'}

function rl(){
  document.getElementById('songList').innerHTML=SL[csl].map((s,i)=>`
    <div class="song-btn" onclick="os(${i})">
      <span class="song-num">${i+1}</span>
      <div class="song-info">
        <div class="song-name">${s.name}</div>
        <div class="song-author">${s.author}</div>
      </div>
      <div class="song-badges">
        <span class="bt ${tc(s.tuning)}">${s.tuning}</span>
        <span class="bt ${bc(s.bass)}">${bl(s.bass)}</span>
      </div>
    </div>`).join('');
}

function sw(n){
  csl=n;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n-1));
  rl();
}

function os(i){
  const s=SL[csl][i];
  document.getElementById('songView').style.display='none';
  document.getElementById('cfgPanel').classList.add('open');
  document.getElementById('cfgTitle').textContent=s.name;
  document.getElementById('cfgAuthor').textContent=s.author;
  document.getElementById('cfgContent').innerHTML=rcfg(s);
  window.scrollTo(0,0);
}

function goBack(){
  document.getElementById('songView').style.display='block';
  document.getElementById('cfgPanel').classList.remove('open');
  window.scrollTo(0,0);
}

rl();
</script>
